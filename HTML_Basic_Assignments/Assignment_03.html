<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block and Inline Elements</title>
    <style>
        .block { display: block; background-color: lightblue; margin: 5px; }
        .inline { display: inline; background-color: lightgreen; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <span class="inline">Inline 1</span>
    <span class="inline">Inline 2</span>
    <span class="inline">Inline 3</span>
</body>
</html>
