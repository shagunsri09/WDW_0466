<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>
</head>
<body>
    <!-- submit.php is a server-side file; create it on a server to process the form. -->
    <form action="submit.php" method="post">
        <input type="text" name="fullname" placeholder="Full name" required><br><br>

        <input type="email" name="email" placeholder="you@college.edu" required><br><br>

        <input type="text" name="mobile" placeholder="10-digit mobile"
               pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>

        <input type="password" name="password" placeholder="Min 6 characters"
               minlength="6" required><br><br>

        <input type="number" name="age" placeholder="Age (17-30)"
               min="17" max="30" required><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
